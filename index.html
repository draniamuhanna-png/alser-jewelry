<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجوهرات طارق السر | ALSER JEWELLRY</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#b9822a;--gold2:#d29a3c;--brown:#8a6a3a;--beige:#f6eadc;--beige2:#efdcc4;--ink:#4a3a24;--bg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,"Segoe UI",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px;position:relative}
#lang{position:absolute;left:16px;top:14px;background:var(--gold);color:#fff;border-radius:8px;font-weight:800;font-size:13px;padding:7px 11px}
.head{text-align:center;padding-top:34px}
.logo{width:112px;height:112px;border-radius:50%;display:block;margin:0 auto 12px}
.head h1{margin:0;color:var(--gold);font-size:25px;font-weight:800}
.head .en{color:#c9b08a;font-weight:800;letter-spacing:.5px;margin-top:2px;font-size:19px}
.quick{display:flex;justify-content:center;gap:22px;margin:18px 0 6px;position:relative}
.quick button{width:54px;height:54px;border-radius:50%;background:var(--beige);color:var(--gold);font-size:25px;display:flex;align-items:center;justify-content:center}
.quick button:active{transform:scale(.94)}
#tip{position:absolute;top:62px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--beige2);box-shadow:0 8px 24px rgba(120,90,40,.18);border-radius:14px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;display:none;z-index:3}
h2.sec{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--gold);font-size:21px;font-weight:800;margin:26px 0 14px}
h2.sec .i{font-size:26px}
.cats{display:flex;justify-content:space-between;gap:6px}
.cat{flex:1;aspect-ratio:1;max-width:92px;border-radius:50%;background:var(--beige);color:var(--brown);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;font-weight:700;border:1.5px solid transparent;transition:.3s}
.cat .i{font-size:30px;color:var(--gold)}
.cat.on{border-color:var(--gold);box-shadow:0 4px 14px rgba(185,130,42,.28);background:#fbf3e8}
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:22px 13% 24px;margin:6px -16px 0;scrollbar-width:none;overscroll-behavior-x:contain}
.car::-webkit-scrollbar{display:none}
.card{flex:0 0 74%;scroll-snap-align:center;border-radius:20px;background:linear-gradient(160deg,#f9eedf,#f0dcc2);padding:14px 10px 12px;text-align:center;transition:transform .35s,box-shadow .35s;transform:scale(.94);box-shadow:0 3px 10px rgba(120,90,40,.1);animation:fade .4s}
.card.on{transform:scale(1.04);box-shadow:0 12px 26px rgba(150,105,40,.28)}
.card h3{margin:0 0 6px;font-size:21px;font-weight:800;color:var(--brown)}
.card .art{position:relative;aspect-ratio:1.06;display:flex;align-items:center;justify-content:center}
.card img{width:100%;height:100%;object-fit:cover;border-radius:14px;-webkit-mask-image:radial-gradient(closest-side,#000 82%,transparent);mask-image:radial-gradient(closest-side,#000 82%,transparent)}
.card .r360{font-size:12px;font-weight:700;color:var(--brown);display:flex;align-items:center;justify-content:center;gap:4px;opacity:.85}
.dots{display:flex;justify-content:center;gap:7px;margin-top:2px}.dots i{width:9px;height:9px;border-radius:50%;background:#dcc7a4;transition:.3s}.dots i.on{background:var(--gold);transform:scale(1.2)}
.empty{text-align:center;color:var(--brown);padding:34px 10px;background:var(--beige);border-radius:18px;margin-top:8px;font-weight:600}
.why{background:linear-gradient(160deg,#f9eedf,#f3e2cb);border-radius:16px;padding:12px 8px 14px;margin-top:22px}
.why h2{margin:0 0 10px;text-align:center;font-size:15px;font-weight:800;color:var(--brown);display:flex;align-items:center;gap:10px}
.why h2:before,.why h2:after{content:"";flex:1;height:1px;background:var(--gold2);opacity:.6}
.why .row{display:flex}.why .it{flex:1;text-align:center;font-size:12px;font-weight:600;padding:0 6px;border-inline-start:1px solid rgba(185,130,42,.35)}
.why .it:first-child{border:0}.why .it .i{font-size:26px;color:var(--gold);margin-bottom:4px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px;display:block}
.rev{background:linear-gradient(160deg,#f9eedf,#f6e8d4);border-radius:20px;padding:18px;display:flex;gap:14px;align-items:center;min-height:128px}
.rev img{width:80px;height:80px;border-radius:50%;object-fit:cover;flex:none;border:2px solid #fff}
.rev b{font-size:19px;color:var(--brown)}.rev p{margin:2px 0 6px;font-size:14px;line-height:1.7}
.stars{color:var(--gold);letter-spacing:2px;font-size:16px}
.gold{margin-top:26px;border-radius:22px;background:linear-gradient(160deg,#faf0e2,#f1dfc6);padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}
.gold h3{margin:0;display:flex;gap:8px;align-items:center;font-size:17px;color:var(--brown);grid-column:1/-1}.gold h3 .i{color:var(--gold);font-size:26px}
.gold .px{font-size:44px;font-weight:800;line-height:1}.gold small{display:block;font-size:12px;color:var(--brown)}
.gold .up{color:#2e8b57;font-weight:700}.gold .dn{color:#c0392b;font-weight:700}
.gold svg.ch{width:100%;height:70px}
.btn-s{display:inline-flex;gap:6px;align-items:center;background:var(--gold);color:#fff;border-radius:20px;padding:8px 18px;font-weight:700;font-size:14px}
.foot{text-align:center;margin-top:54px;color:#444;font-size:13px}.foot .n{display:flex;align-items:center;gap:10px;justify-content:center;letter-spacing:.6px;direction:ltr}.foot .n i{width:26px;height:1.5px;background:var(--gold2)}.foot small{display:block;color:#aaa;font-size:10px;margin-top:6px}
/* popup */
#ov{position:fixed;inset:0;background:rgba(40,28,10,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:14px;backdrop-filter:blur(2px)}
#ov.on{display:flex}
#pop{background:#fff;border-radius:28px;width:100%;max-width:460px;max-height:calc(100dvh - 28px);overflow:auto;padding:16px 14px 16px;box-shadow:0 20px 60px rgba(0,0,0,.35);position:relative;animation:pop .3s}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}@keyframes fade{from{opacity:0}}
#x{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;background:var(--beige);color:var(--ink);font-size:20px;display:flex;align-items:center;justify-content:center;z-index:2}
.pt{text-align:center;padding:4px 44px 0}.pt h2{margin:0;font-size:25px;font-weight:800}.pt p{margin:4px 0 12px;color:var(--brown);font-weight:600;font-size:15px}
.vbox{position:relative;border-radius:22px;background:radial-gradient(circle at 50% 60%,#f8eadb,#eed8bf);aspect-ratio:1/1.04;overflow:hidden;touch-action:pan-y}
.vbox model-viewer{width:100%;height:100%;--poster-color:transparent;background:transparent}
.vbox .b360,.vbox .fs{position:absolute;top:10px;background:rgba(255,255,255,.7);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink);z-index:2}
.vbox .b360{left:10px;font-weight:800;font-size:13px;padding:4px 8px;gap:3px}.vbox .fs{right:10px;width:34px;height:34px;font-size:18px}
.vbox .ctl{position:absolute;bottom:34px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:2}
.vbox .ctl button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:19px}
.vbox .hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:12px;padding:3px 12px;font-size:11.5px;font-weight:700;white-space:nowrap;z-index:2;display:flex;gap:5px;align-items:center}
.vst{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px 28px 90px;font-size:13px;line-height:1.7;font-weight:600;background:rgba(246,234,220,.9);z-index:1}
.vst img{width:150px;opacity:.85;border-radius:14px}
.spin{width:34px;height:34px;border:3px solid #eadcc5;border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.info div{background:var(--beige);border-radius:16px;text-align:center;padding:12px 4px;font-size:13px;font-weight:700;color:var(--brown)}.info .i{font-size:30px;color:var(--gold);display:block;margin:0 auto 5px}
.pstrip{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--beige);border-radius:14px;padding:13px;font-weight:800;color:var(--ink)}.pstrip .i{color:var(--gold);font-size:24px}
.pdata{font-size:12.5px;color:var(--brown);text-align:center;margin-top:6px;min-height:0}
.wa{width:100%;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(180deg,#b98a3c,#a47328);color:#fff;border-radius:20px;padding:15px;font-weight:800;font-size:17px}.wa .i{font-size:26px}
.sh{width:100%;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1.5px solid var(--gold2);border-radius:20px;padding:12px;font-weight:700;color:var(--brown)}.sh .i{font-size:22px}
#sheet{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(40,28,10,.45);z-index:60}#sheet.on{display:flex}
#sheet div.s{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:460px;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
#sheet button{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--beige);font-weight:700}#sheet .i{font-size:22px;color:var(--gold)}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#3a2c18;color:#fff;border-radius:20px;padding:9px 18px;font-size:13px;z-index:70;display:none}
[dir=ltr] #lang{left:auto;right:16px}[dir=ltr] #x{right:auto;left:14px}
</style>
</head>

 en:{brand:"Tarek Al-Ser Jewellery",cats:"Luxury Jewellery Collections",why:"Why Al-Ser Jewellery?",brides:"Latest from Our Brides",revT:"Bride Reviews",
  w1:"High quality, precise standards",w2:"Modern, elegant design",w3:"Outstanding, continuous support",empty:"Coming soon: pieces for this collection will appear here",

  hint:"Drag to rotate 360°",gift:"Great for gifts",quality:"Guaranteed quality",kt:"K",ktNA:"Karat varies by piece",strip:"Price follows today's gold price",order:"Order now via WhatsApp",share:"Share product",

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let lang="ar", cat="rings", openId=null;
try{ lang=localStorage.getItem("alser-lang")||"ar"; }catch(e){}
const t=k=>I18N[lang][k], L=(o,k)=>lang==="ar"?o[k]:(o[k+"En"]||o[k]);
const ico=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const pname=p=>lang==="ar"?p.ar:p.en, pdesc=p=>lang==="ar"?p.descAr:p.descEn;
function toast(m){ const el=$("#toast"); el.textContent=m; el.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.display="none",2200); }
const waLink=txt=>`https://wa.me/${STORE.whatsapp||""}?text=${encodeURIComponent(txt)}`;
const pUrl=p=>location.href.split("#")[0]+"#product-"+p.id;

function applyLang(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  $("#lang").textContent=lang==="ar"?"EN":"ع";
  $$("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.title=(lang==="ar"?"مجوهرات طارق السر":"Tarek Al-Ser Jewellery")+" | ALSER JEWELLRY";
  $("#why").innerHTML=[["shield","w1"],["design","w2"],["dia","w3"]].map(([i,k])=>`<div class="it">${ico(i)}<div>${t(k)}</div></div>`).join("");
  $("#yr").textContent=new Date().getFullYear()+" / "+(new Date().getFullYear()+1);
  renderCats(); renderCar(); renderGallery(); renderReview(); renderGold();
  if(openId) renderPopup(STORE.products.find(p=>p.id===openId));
}
/* ----- التصنيفات والمعرض ----- */
function renderCats(){
  $("#cats").innerHTML=STORE.categories.map(c=>`<button class="cat${c.id===cat?" on":""}" data-c="${c.id}">${ico(c.icon)}<span>${lang==="ar"?c.ar:c.en}</span></button>`).join("");
}
function renderCar(){
  const list=STORE.products.filter(p=>p.cat===cat), car=$("#car");
  if(!list.length){ car.style.cssText="display:block;padding:0;overflow:visible"; car.innerHTML=`<div class="empty">${t("empty")}</div>`; $("#dots").innerHTML=""; return; }
  car.style.cssText="";
  car.innerHTML=list.map(p=>`<button class="card" data-id="${p.id}"><h3>${pname(p)}</h3><div class="art"><img loading="lazy" src="${p.img}" alt="${pname(p)}"></div><div class="r360">${ico("rot")} 360°</div></button>`).join("");
  $("#dots").innerHTML=list.map(()=>"<i></i>").join(""); car.scrollLeft=0; markActive();
}
function markActive(){
  const car=$("#car"), cards=$$("#car .card"); if(!cards.length) return;
  const c=car.getBoundingClientRect(); const mid=c.left+c.width/2; let best=0,bd=1e9;
  cards.forEach((el,i)=>{ const r=el.getBoundingClientRect(), d=Math.abs(r.left+r.width/2-mid); if(d<bd){bd=d;best=i;} });
  cards.forEach((el,i)=>el.classList.toggle("on",i===best)); $$("#dots i").forEach((d,i)=>d.classList.toggle("on",i===best));
}
$("#car").addEventListener("scroll",()=>{ cancelAnimationFrame(markActive.r); markActive.r=requestAnimationFrame(markActive); },{passive:true});
$("#cats").addEventListener("click",e=>{ const b=e.target.closest(".cat"); if(!b) return; cat=b.dataset.c; renderCats(); renderCar(); });
$("#car").addEventListener("click",e=>{ const b=e.target.closest(".card"); if(b) location.hash="product-"+b.dataset.id; });
/* ----- بقية الأقسام ----- */
function renderGallery(){ $("#gal").innerHTML=STORE.showcase.map(s=>`<img loading="lazy" src="${s}" alt="">`).join(""); }
let ri=0;
function renderReview(){
  const r=STORE.reviews[ri%STORE.reviews.length]; if(!r) return;
  $("#rev").innerHTML=`<img src="${r.img}" alt=""><div><b>${lang==="ar"?r.name:r.nameEn}</b><p>${lang==="ar"?r.ar:r.en}</p><div class="stars">${"★".repeat(r.stars)}${"☆".repeat(5-r.stars)}</div></div>`;
  $("#rdots").innerHTML=STORE.reviews.length>1?STORE.reviews.map((_,i)=>`<i class="${i===ri?"on":""}" data-i="${i}"></i>`).join(""):"";
}
$("#rdots").addEventListener("click",e=>{ const d=e.target.closest("i"); if(d){ ri=+d.dataset.i; renderReview(); } });
const OZ=31.1035;
const calcG=(x,fx)=>x/OZ*(STORE.gold.karat/24)*fx*(1+(STORE.gold.markupPct||0)/100);
try{ const sv=JSON.parse(localStorage.getItem("alser-gold")||"null"); const h=STORE.gold.history; if(sv&&sv.history&&sv.history.length&&sv.history[sv.history.length-1].d>h[h.length-1].d) Object.assign(STORE.gold,sv); }catch(e){}
function renderGold(){
  const g=STORE.gold, h=g.history, n=h.length, cur=h[n-1].v, prev=n>1?h[n-2].v:cur, pct=prev?((cur/prev-1)*100):0, up=pct>=0;
  const W=140,H=64,mn=Math.min(...h.map(x=>x.v)),mx=Math.max(...h.map(x=>x.v)),sp=(mx-mn)||1;
  const pts=h.map((x,i)=>[i*(W-10)/(Math.max(n-1,1))+3,H-8-(x.v-mn)/sp*(H-22)]);
  const path=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" "), lp=pts[pts.length-1];
  const area=path+` L${lp[0].toFixed(1)} ${H} L${pts[0][0].toFixed(1)} ${H} Z`;
  const loc=lang==="ar"?"ar":"en", fmt=d=>new Date(d+"T12:00:00").toLocaleDateString(loc,{day:"numeric",month:"short"});
  const live=g.source==="live", when=g.updatedAt?new Date(g.updatedAt).toLocaleString(loc,{dateStyle:"medium",timeStyle:"short"}):new Date(g.asOf+"T12:00:00").toLocaleDateString(loc,{dateStyle:"medium"});
  $("#gold").innerHTML=`<h3>${ico("trend")} ${t("gold")}</h3>
   <div><svg class="ch" viewBox="0 0 ${W} ${H}" style="direction:ltr"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d29a3c" stop-opacity=".35"/><stop offset="1" stop-color="#d29a3c" stop-opacity="0"/></linearGradient></defs>
     <path d="${area}" fill="url(#gg)"/><path d="${path}" fill="none" stroke="#c8922f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lp[0]}" cy="${lp[1]}" r="3.4" fill="#fff" stroke="#c8922f" stroke-width="2"/></svg>
     <small style="direction:ltr;text-align:center;display:flex;justify-content:space-between"><span>${fmt(h[0].d)}</span><span>${fmt(h[n-1].d)}</span></small></div>
   <div><small>${t("karat")} ${g.karat} · ${t("perg")}</small><div class="px"><span style="font-size:26px">${g.currency}</span> ${Math.round(cur)}</div>
     <span class="${up?"up":"dn"}">${up?"+":""}${pct.toFixed(2)}% ${up?"▲":"▼"}</span></div>
   <small>${ico("clock")} ${t("updated")}: ${when}<br>${live?t("live"):t("saved")}<br>${t("basis")}</small>
   <div style="text-align:end">${g.detailsUrl?`<a class="btn-s" href="${g.detailsUrl}" target="_blank" rel="noopener">${t("details")}</a>`:`<span class="btn-s" style="opacity:.55">${t("details")}</span>`}</div>`;
}
/* تحديث تلقائي يومي: يقرأ من STORE.gold.endpoint (دالة gold.js) ويضيف نقطة اليوم للرسم */
async function refreshGold(){
  const g=STORE.gold; if(!g.endpoint) return;
  try{
    const r=await fetch(g.endpoint,{cache:"no-store"}); if(!r.ok) throw 0; const j=await r.json();
    if(!(j.xauUsd>0 && j.usdIls>0)) throw 0;
    g.xauUsd=j.xauUsd; g.usdIls=j.usdIls; g.updatedAt=j.updatedAt||new Date().toISOString(); g.asOf=g.updatedAt.slice(0,10); g.source="live";
    const v=+calcG(j.xauUsd,j.usdIls).toFixed(2), h=g.history;
    if(h[h.length-1].d===g.asOf) h[h.length-1].v=v; else h.push({d:g.asOf,v});
    if(h.length>30) h.splice(0,h.length-30);
    try{ localStorage.setItem("alser-gold",JSON.stringify(g)); }catch(e){}
    renderGold();
  }catch(e){ /* يبقى آخر سعر محفوظ ويظهر بوصف «غير لحظي» */ }
}
refreshGold(); setInterval(refreshGold,3600000); document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refreshGold(); });
/* ----- أيقونات التواصل العلوية ----- */
$(".quick").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; const k=b.dataset.q, tip=$("#tip");
  if(k==="wa"){ window.open(waLink(""),"_blank","noopener"); return; }
  if(k==="ig" && STORE.instagram){ window.open(STORE.instagram,"_blank","noopener"); return; }
  const txt=k==="hours"?(STORE.hours[lang]||""):""; tip.textContent=txt||t("notSet"); tip.style.display="block"; clearTimeout(tip.t); tip.t=setTimeout(()=>tip.style.display="none",2600);
});
$("#lang").onclick=()=>{ lang=lang==="ar"?"en":"ar"; try{localStorage.setItem("alser-lang",lang);}catch(e){} applyLang(); };

/* ============ نافذة المنتج ============ */
let mvPromise=null, mvEl=null;
function loadMV(){
  if(mvPromise) return mvPromise;
  return mvPromise=new Promise((res,rej)=>{
    if(customElements.get("model-viewer")) return res();
    const s=document.createElement("script"); s.type="module"; s.src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js";
    s.onerror=()=>{ mvPromise=null; rej(); }; document.head.appendChild(s);
    customElements.whenDefined("model-viewer").then(res); setTimeout(()=>{ if(!customElements.get("model-viewer")){ mvPromise=null; rej(); } },12000);
  });
}
function renderPopup(p){
  if(!p) return; const m=p.model3d||{};
  const priceBits=[p.weight!=null?`${t("wg")}: ${p.weight}`:"",p.price!=null?`${t("wt")}: ${p.price}`:""].filter(Boolean).join(" · ");
  $("#pop").innerHTML=`<button id="x" aria-label="${t("close")}">${ico("close")}</button>
   <div class="pt"><h2>${pname(p)}</h2><p>${pdesc(p)}</p></div>
   <div class="vbox" id="vbox"><div class="b360">${ico("rot")} 360°</div><button class="fs" id="fs" aria-label="fullscreen">${ico("full")}</button>
     <div id="vmount" style="position:absolute;inset:0"></div>
     <div class="ctl"><button id="vr" aria-label="reset">${ico("reset")}</button><button id="vp" aria-label="zoom in">${ico("plus")}</button><button id="vm" aria-label="zoom out">${ico("minus")}</button></div>
     <div class="hint">${ico("rot")} ${t("hint")}</div></div>
   <div class="info"><div>${ico("gift")}${p.gift!==false?t("gift"):"—"}</div><div>${ico("dia")}${p.karat?t("kt")+" "+p.karat:t("ktNA")}</div><div>${ico("shield")}${t("quality")}</div></div>
   <div class="pstrip">${ico("chart")}<span>${t("strip")}</span></div>${priceBits?`<div class="pdata">${priceBits}</div>`:""}
   <button class="wa" id="order">${ico("wa")}<span>${t("order")}</span></button>
   <button class="sh" id="share">${ico("share")}<span>${t("share")}</span></button>`;
  mountViewer(p,m);
  $("#x").onclick=closePop; $("#order").onclick=()=>window.open(waLink(`${t("msg")}\n${pname(p)}\n${pUrl(p)}${p.price!=null?`\n${t("wt")}: ${p.price}`:""}`),"_blank","noopener");
  $("#share").onclick=()=>shareProduct(p);
  $("#fs").onclick=()=>{ const b=$("#vbox"); (b.requestFullscreen||b.webkitRequestFullscreen||(()=>toast(t("notSet")))).call(b); };
}
function status(html,spin){ const v=$("#vmount"); if(v) v.insertAdjacentHTML("beforeend",`<div class="vst" id="vst">${spin?'<div class="spin"></div>':""}${html}</div>`); }
function mountViewer(p,m){
  mvEl=null; const mount=$("#vmount");
  if(!m.src){ status(`<img src="${p.img}" alt="" style="filter:grayscale(.2)"><div>${t("no3d")}</div>`); return; }
  status(t("loading"),true);
  loadMV().then(()=>{
    if(openId!==p.id) return;
    const el=document.createElement("model-viewer");
    el.setAttribute("src",m.src); el.setAttribute("camera-controls",""); el.setAttribute("auto-rotate",""); el.setAttribute("shadow-intensity","1"); el.setAttribute("interaction-prompt","none");
    el.setAttribute("touch-action","pan-y"); el.setAttribute("alt",pname(p)); el.setAttribute("exposure","1.05");
    el.addEventListener("load",()=>{ const s=$("#vst"); if(s) s.remove(); });
    el.addEventListener("error",()=>{ const s=$("#vst"); if(s) s.remove(); status(t("err3d")); });
    el.addEventListener("pointerdown",()=>el.removeAttribute("auto-rotate"),{once:true});
    mount.prepend(el); mvEl=el;
  }).catch(()=>{ const s=$("#vst"); if(s) s.remove(); status(t("err3d")); });
}
document.addEventListener("click",e=>{
  if(!mvEl) return; const id=e.target.closest("#vr,#vp,#vm"); if(!id) return;
  if(id.id==="vr"){ mvEl.cameraOrbit="0deg 75deg auto"; mvEl.fieldOfView="auto"; mvEl.resetTurntableRotation&&mvEl.resetTurntableRotation(); }
  else if(mvEl.zoom) mvEl.zoom(id.id==="vp"?1:-1);
});
/* ----- المشاركة ----- */
async function shareProduct(p){
  const data={title:pname(p),text:`${pname(p)} — ${pdesc(p)}`,url:pUrl(p)};
  if(navigator.share){ try{ await navigator.share(data); return; }catch(e){ if(e&&e.name==="AbortError") return; } }
  const full=`${data.text}\n${data.url}`;
  $("#sheetIn").innerHTML=`<button data-s="wa">${ico("wa")}${t("wa")}</button><button data-s="sms">${ico("sms")}${t("sms")}</button><button data-s="copy">${ico("copy")}${t("copy")}</button><button data-s="x">${ico("close")}${t("close")}</button>`;
  $("#sheet").classList.add("on");
  $("#sheetIn").onclick=async e=>{ const b=e.target.closest("button"); if(!b) return; const k=b.dataset.s;
    if(k==="wa") window.open("https://wa.me/?text="+encodeURIComponent(full),"_blank","noopener");
    else if(k==="sms") location.href="sms:?&body="+encodeURIComponent(full);
    else if(k==="copy"){ try{ await navigator.clipboard.writeText(data.url); }catch(_){ const ta=document.createElement("textarea"); ta.value=data.url; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); } toast(t("copied")); }
    $("#sheet").classList.remove("on"); };
}
$("#sheet").addEventListener("click",e=>{ if(e.target.id==="sheet") $("#sheet").classList.remove("on"); });
/* ----- فتح/إغلاق + الرابط المباشر ----- */
function openPop(id){
  const p=STORE.products.find(x=>x.id===id); if(!p) return closePop(true);
  openId=id; renderPopup(p); $("#ov").classList.add("on"); document.documentElement.style.overflow="hidden"; setTimeout(()=>{ const x=$("#x"); x&&x.focus(); },50);
}
function closePop(silent){
  openId=null; mvEl=null; $("#ov").classList.remove("on"); $("#pop").innerHTML=""; $("#sheet").classList.remove("on"); document.documentElement.style.overflow="";
  if(!silent && /^#product-/.test(location.hash)) history.replaceState(null,"",location.href.split("#")[0]);
}
$("#ov").addEventListener("click",e=>{ if(e.target.id==="ov") closePop(); });
addEventListener("keydown",e=>{ if(e.key==="Escape"){ if($("#sheet").classList.contains("on")) $("#sheet").classList.remove("on"); else if(openId) closePop(); } });
function route(){ const m=location.hash.match(/^#product-([a-z0-9-]+)$/i); if(m){ const p=STORE.products.find(x=>x.id===m[1]); if(p){ cat=p.cat; if(!openId){ renderCats(); renderCar(); } openPop(m[1]); return; } } if(openId) closePop(true); }
addEventListener("hashchange",route);
applyLang(); route();
</script>
